<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Usuarios</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom styles -->
    <link href="/css/style.css" rel="stylesheet">
	
	<!-- Bootstrap Icons -->
	    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">Lista de Usuarios</h2>
    <!-- Mensajes de éxito o error -->
    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>DNI</th>
                    <th>Email</th>
					<th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
             <tbody id="usuarios-tbody">
						</tbody>
        </table>
    </div>
	<div class="btn-back">
		<a href="/panel.html" class="btn btn-outline-primary">
		<i class="bi bi-arrow-left"></i> Volver al Panel
		            </a>
	</div>
</div>
<script src="/js/bootstrap.bundle.min.js"></script>
<script>

	document.addEventListener('DOMContentLoaded', function () {
	    const tbody = document.getElementById('usuarios-tbody');

	    fetch('/api/manager/listar')
	        .then(response => response.json())
	        .then(usuarios => {
	            tbody.innerHTML = '';

	            usuarios.forEach(usuario => {
					if (usuario.rol !== 'USER' && usuario.rol !== 'EMPLEADO') return;
	                const tr = document.createElement('tr');

	                tr.innerHTML = `
	                    <td>${usuario.nombre}</td>
	                    <td>${usuario.apellido}</td>
	                    <td>${usuario.dni}</td>
	                    <td>${usuario.email}</td>
	                    <td>${usuario.rol}</td>
	                    <td>
	                        ${usuario.rol === 'USER'
	                            ? `<button class="btn btn-sm btn-success convertir-btn" data-id="${usuario.id}">Convertir a Empleado</button>`
	                            : usuario.rol === 'EMPLEADO'
	                            ? `<button class="btn btn-sm btn-danger sacar-permisos-btn" data-id="${usuario.id}">Sacar permisos</button>`
	                            : ''
	                        }
	                    </td>
	                `;

	                tbody.appendChild(tr);
	            });
	        })
	        .catch(error => {
	            console.error('Error al cargar usuarios:', error);
	        });


			tbody.addEventListener('click', function (e) {
				        const btn = e.target;

				        if (btn.classList.contains('convertir-btn')) {
				            const id = btn.getAttribute('data-id');
							
							window.location.href = `formulario_empleado.html?id=${id}`;
				            
				        }

	        if (btn.classList.contains('sacar-permisos-btn')) {
	            if (!confirm('¿Estás seguro que querés sacar permisos a este empleado?')) return;

				const id = btn.getAttribute('data-id');

				fetch(`/api/manager/sacar-permisos/${id}`, {
				  method: 'POST',
				})			  .then(response => {
			    if (!response.ok) {
			      return response.text().then(text => { throw new Error(text) });
			    }
			    return response.text();
			  })
			  .then(msg => {
			    alert(msg);
				window.location.reload();
			  })
			  .catch(error => {
			    alert('Error: ' + error.message);
			  });
	        }
	    });
	});

	
	

</script>
</body>
</html>
