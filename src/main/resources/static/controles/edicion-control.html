<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Control</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .alert:empty { display: none; }
        .message-container { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Editar Control #<span id="controlID"></span></h2>
        <h4 class="mb-4">Título del Ticket: <span id="tituloticket"></span></h4>

        <div id="alertContainer" class="message-container"></div>
        <div id="AlertaPendiente" class="alert alert-warning" role="alert" style="display:none;">
            <i class="bi bi-lock-fill"></i> Este control está finalizado y no puede ser editado.
        </div>

        <form id="formEdicion"> 
            <fieldset id="permisoEdicion" disabled> <div class="mb-3">
                    <label for="funcion" class="form-label">Función/Tipo de Intervención</label>
                    <select id="funcion" class="form-select" name="funcion">
                        <option value="">-- Seleccione una función --</option>
                        </select>
                    <div id="funcionError" class="text-danger"></div>
                </div>

                <div class="mb-3">
					<label for="accion">Acción Realizada (Detalles):</label>
	                <textarea id="accion" name="accion" rows="5" required placeholder="Ej: Se reviso el ticket con un ejecutivo."></textarea>
					<div id="accionError" class="text-danger"></div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="finalizado" name="finalizado">
                    <label class="form-check-label" for="finalizado">Finalizar esta intervención (Cierra el ticket si se resuelve)</label>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Guardar Cambios
                </button>
            </fieldset>
        </form>

        <div class="mt-3">
			<a onclick="history.back()" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	    <script>
	        document.addEventListener('DOMContentLoaded', async function () {
	            const urlParametros = new URLSearchParams(window.location.search);
	            const controlId = urlParametros.get('id');
	            const ticketId = urlParametros.get('ticketId');

	            const controlID = document.getElementById('controlID');
	            const tituloticket = document.getElementById('tituloticket');
	            const formEdicion = document.getElementById('formEdicion');
	            const permisoEdicion = document.getElementById('permisoEdicion');
	            const AlertaPendiente = document.getElementById('AlertaPendiente');

	            const funcionesDisponibles = document.getElementById('funcion');
	            const textoAccion = document.getElementById('accion');
	            const finalizado = document.getElementById('finalizado');

	            const funcionError = document.getElementById('funcionError');
	            const accionError = document.getElementById('accionError');

	            // Validar que los IDs están presentes
	            if (!controlId || !ticketId) {
	                mostrarMensaje('danger', 'Error: ID de control o ticket no proporcionado en la URL.');
	                permisoEdicion.setAttribute('disabled', true);
	                return;
	            }

	            const funciones = ["ESCALAMIENTO", "AUDITORIA", "VALIDACION", "SEGUIMIENTO"];
	            funciones.forEach(func => {
	                const option = document.createElement('option');
	                option.value = func;
	                option.textContent = func.charAt(0).toUpperCase() + func.slice(1).toLowerCase();
	                funcionesDisponibles.appendChild(option);
	            });

	            try {
	                const response = await fetch(`/api/control/detalle/${controlId}`);
	                if (!response.ok) {
	                    const errorText = await response.text();
	                    throw new Error(`Error al cargar los datos del control: ${errorText || response.statusText}`);
	                }

	                const controlData = await response.json();
	                controlID.textContent = controlData.idControl;
	                tituloticket.textContent = controlData.tituloTicket || 'N/A'; 
	                funcionesDisponibles.value = controlData.funcion || '';
	                textoAccion.value = controlData.accion || '';
	                finalizado.checked = controlData.finalizado || false;
	                //fechaEntradaInput.value = formatDate(controlData.fechaEntrada);
	                //fechaSalidaInput.value = formatDate(controlData.fechaSalida);
	                
	                permisoEdicion.removeAttribute('disabled');

	                //Esto es para realizar la verificacion que saque de los metodos del restcontroller
	                if (controlData.finalizado) {
	                    AlertaPendiente.style.display = 'block';
	                    permisoEdicion.setAttribute('disabled', true);
	                    mostrarMensaje('info', 'Este control ya está finalizado y no puede ser editado.', 'alertContainer');
	                }

	            } catch (error) {
					mostrarMensaje('danger', `Error al cargar la información`);
					console.error(error);
	                permisoEdicion.setAttribute('disabled', true);
	                return;
	            }

	            formEdicion.addEventListener('submit', async function (event) {
	                event.preventDefault();
	                funcionError.textContent = '';
	                accionError.textContent = '';
	                mostrarMensaje('','');

	                const actualizacionControl = {
	                    idControl: controlId,
	                    accion: accionTextarea.value,
	                    funcion: funcionesDisponibles.value,
	                    finalizado: finalizado.checked,
	                };

	                try {
	                    const UrlDelMetodo = `/api/control/${ticketId}/edicion/${controlId}`;
	                    const response = await fetch(UrlDelMetodo, {
	                        method: 'PUT',
	                        headers: {
	                            'Content-Type': 'application/json'
	                        },
	                        body: JSON.stringify(actualizacionControl)
	                    });

	                    if (!response.ok) {
	                        const errorBody = await response.json();
	                        let errorMessage = errorBody.message || 'Error desconocido al actualizar.';
	                        if (errorBody.errors) {
	                            errorBody.errors.forEach(err => {
	                                if (err.field === 'funcion') funcionError.textContent = err.defaultMessage;
	                                if (err.field === 'accion') accionError.textContent = err.defaultMessage;
	                            });
	                            errorMessage = 'Por favor, corrija los errores en el formulario.';
	                        }
	                        throw new Error(errorMessage);
	                    }

	                    mostrarMensaje('success', 'Control actualizado exitosamente.');
	                    sessionStorage.setItem('successMessage', 'Control actualizado exitosamente.');
	                    
	                    setTimeout(() => {
	                        window.location.href = `/listado-controles.html?ticketId=${ticketId}`;
	                    }, 1500); 

	                } catch (error) {
	                    console.error('Error al actualizar control:', error);
	                    mostrarMensaje('danger', `Error al guardar los cambios: ${error.message}`);
	                }
	            });
	        });
	    </script>
</body>

</html>
