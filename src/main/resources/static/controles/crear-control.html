<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Crear Nuevo Control para Ticket</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link href="/css/bootstrap.min.css" rel="stylesheet">
	<link href="/css/styles.css" rel="stylesheet">
	<style>
		.alert:empty {
			display: none;
		}

		.mensaje {
			padding: 1rem;
			margin-bottom: 1rem;
			border: 1px solid transparent;
			border-radius: 0.25rem;
			font-weight: bold;
		}

		.mensaje.success {
			color: #0f5132;
			background-color: #d1e7dd;
			border-color: #badbcc;
		}

		.mensaje.danger {
			color: #842029;
			background-color: #f8d7da;
			border-color: #f5c2c7;
		}

		.mensaje.warning {
			color: #664d03;
			background-color: #fff3cd;
			border-color: #ffecb5;
		}

		/* Puedes añadir más tipos si los usas, como 'info' */
		.mensaje.info {
			color: #055160;
			background-color: #cff4fc;
			border-color: #b6effb;
		}
	</style>
</head>

<body>
	<div class="container mt-5">
		<div id="mensaje-container"></div>
		<h2 class="mb-4">Crear Nuevo Control para Ticket #<span id="ticketID"></span></h2>
		<h4 class="mb-4">Título: <span id="tituloTicket"></span></h4>

		<form id="formCreacion">
			<fieldset id="permisoEdicion">
				<div class="mb-3">
					<label for="funcion" class="form-label">Función/Tipo de Intervención</label>
					<select id="funcion" class="form-select" name="funcion">
						<option value="">-- Seleccione una función --</option>
					</select>
					<div id="funcionError" class="text-danger"></div>
				</div>

				<div class="mb-3">
					<label for="accion" class="form-label">Acción Realizada / Observaciones</label>
					<textarea id="accion" class="form-control" name="accion" rows="5"></textarea>
					<div id="accionError" class="text-danger"></div>
				</div>

				<div class="mb-3 form-check">
					<input type="checkbox" class="form-check-input" id="finalizado" name="finalizado">
					<label class="form-check-label" for="finalizado">Finalizar esta intervención (Cierra el ticket si se
						resuelve)</label>
				</div>

				<button type="submit" class="btn btn-primary">
					<i class="bi bi-save"></i> Registrar Control
				</button>
			</fieldset>
		</form>

		<div class="mt-3">
			<a onclick="history.back()" class="btn btn-outline-primary">
				<i class="bi bi-arrow-left"></i> Volver
			</a>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script>
		document.addEventListener('DOMContentLoaded', async function () {
			const urlParametros = new URLSearchParams(window.location.search);
			const ticketId = urlParametros.get('ticketId');

			const ticketID = document.getElementById('ticketID');
			const ticketTitulo = document.getElementById('tituloTicket');
			const formCreacion = document.getElementById('formCreacion');
			const permisoEdicion = document.getElementById('permisoEdicion');
			const AlertaPendiente = document.getElementById('alertaPendiente');

			const funcionesDisponibles = document.getElementById('funcion');
			const textoAccion = document.getElementById('accion');
			const finalizado = document.getElementById('finalizado');
			const funcionError = document.getElementById('funcionError');
			const accionError = document.getElementById('accionError');

			// 1. Cargar datos del ticket y opciones de funciones
			try {
				const ticketResponse = await fetch(`/api/control/detalleTicket/${ticketId}`);
				if (!ticketResponse.ok) {
					const errorText = await ticketResponse.text();
					throw new Error(`Error al cargar los datos del ticket: ${errorText || ticketResponse.statusText}`);
				}
				const ticketData = await ticketResponse.json();
				ticketID.textContent = ticketData.idTicket;
				ticketTitulo.textContent = ticketData.titulo || 'N/A';
				const funciones = ["ESCALAMIENTO", "AUDITORIA", "VALIDACION", "SEGUIMIENTO"];

				funciones.forEach(func => {
					const option = document.createElement('option');
					option.value = func;
					option.textContent = func.charAt(0).toUpperCase() + func.slice(1).toLowerCase();
					funcionesDisponibles.appendChild(option);
				});
				const controlPendienteResponse = await fetch(`/api/control/${ticketId}/ControlPendiente`);
				if (!controlPendienteResponse.ok) {
					console.warn('No se pudo verificar si hay un control pendiente.');
				}
				const tienePendiente = await controlPendienteResponse.json();

				if (tienePendiente) {
					if (permisoEdicion) {
						permisoEdicion.setAttribute('disabled', true); // Deshabilitar el formulario
					}
					if (AlertaPendiente) {
						AlertaPendiente.style.display = 'block'; // Mostrar la alerta
						AlertaPendiente.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i> Ya existe una intervención en curso para este ticket. No puedes iniciar una nueva hasta que la anterior sea finalizada.';
					}
					mostrarMensaje('warning', 'Ya existe una intervención en curso para este ticket. No puedes iniciar una nueva hasta que la anterior sea finalizada.');
				} else {
					if (permisoEdicion) {
						permisoEdicion.removeAttribute('disabled'); // HABILITAR el formulario
					}
					if (AlertaPendiente) {
						AlertaPendiente.style.display = 'none'; // Ocultar la alerta si no hay pendiente
					}
				}
			} catch (error) {
				mostrarMensaje('danger', `Error al cargar la información`);
				console.error(error);
				permisoEdicion.setAttribute('disabled', true);
				return;
			}

			formCreacion.addEventListener('submit', async function (event) {
				event.preventDefault();

				funcionError.textContent = '';
				accionError.textContent = '';

				const controlData = {
					accion: textoAccion.value,
					funcion: funcionesDisponibles.value,
					finalizado: finalizado.checked,
				};

				try {
					const apiUrl = `/api/control/${ticketId}/nuevo`;

					const response = await fetch(apiUrl, {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json'
						},
						body: JSON.stringify(controlData)
					});

					if (!response.ok) {
						const errorBody = await response.json();
						let errorMessage = errorBody.message || 'Error desconocido al crear.';
						if (errorBody.errors) {
							errorBody.errors.forEach(err => {
								if (err.field === 'funcion') funcionError.textContent = err.defaultError;
								if (err.field === 'accion') accionError.textContent = err.defaultError;
							});
							errorMessage = 'Por favor, corrija los errores en el formulario.';
						}
						throw new Error(errorMessage);
					}

					mostrarMensaje('success', 'Control creado exitosamente.');
					sessionStorage.setItem('successMessage', 'Control creado exitosamente.');

					setTimeout(() => {
						window.location.href = `/controles/listado-controles.html?ticketId=${ticketId}`;
					}, 500);

				} catch (error) {
					console.error('Error al crear control:', error);
					mostrarMensaje('danger', `Error al registrar el control: ${error.message}`);
				}
			});
		});
	</script>
	<script src="/js/utils.js"></script>
</body>

</html>
